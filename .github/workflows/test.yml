name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run the transport-independent test suite
        # The pmd/resp tests are pure Python and need no BLE hardware.
        run: uv run --group dev pytest -q
